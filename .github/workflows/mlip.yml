name: MLIP algorithms
on:
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
jobs:
  algorithms:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install numerical test dependencies (no weights or inference frameworks)
        run: python -m pip install ase==3.29.0 numpy==2.4.3 scipy==1.17.1 rdkit==2026.3.6 sella==2.6.0 "PySide6>=6.8,<7" huggingface-hub==0.36.0 pytest
      - name: Check all shared molecular algorithms
        env:
          PYTHONPATH: src
        run: python -m pytest tests/test_mlip_engine.py tests/test_guided_setup.py -q
