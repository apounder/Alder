name: Linux download

on:
  workflow_dispatch:
  workflow_call:
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            label: x64
          - runner: ubuntu-24.04-arm
            label: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      PYTHONUTF8: '1'
      QT_QPA_PLATFORM: xcb
      QTWEBENGINE_CHROMIUM_FLAGS: --use-gl=angle --use-angle=swiftshader --enable-unsafe-swiftshader
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            packaging/linux-requirements.txt
      - name: Install graphics and packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth dpkg-dev desktop-file-utils libegl1 libopengl0 libnss3 libnspr4 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-image0 libxcb-render-util0 libxcb-shape0 libxcb-randr0 libxcb-sync1 libxcb-xfixes0 libxcb-xkb1 libx11-xcb1 libsm6 libice6 libgl1 libxkbcommon-x11-0 libasound2t64 libx11-6 libxcomposite1 libxdamage1 libxrandr2 libxtst6 libxss1 libgbm1 libdrm2 libfontconfig1 libglib2.0-0t64 libdbus-1-3
          python -m pip install -r packaging/linux-requirements.txt ".[dev]"
      - name: Check Qt X11 libraries and virtual display
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          from PySide6.QtCore import QLibraryInfo
          plugin = Path(QLibraryInfo.path(QLibraryInfo.LibraryPath.PluginsPath)) / 'platforms/libqxcb.so'
          result = subprocess.run(['ldd', str(plugin)], text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, check=True)
          print(result.stdout)
          if 'not found' in result.stdout:
              raise SystemExit('Qt X11 runtime libraries are missing; see the ldd output above.')
          PY
          xvfb-run -a python -c 'from PySide6.QtWidgets import QApplication; app = QApplication([]); assert app.platformName() == "xcb"; print("Qt X11 display initialized successfully")'
      - name: Check parsers, native chemistry, and setup
        run: xvfb-run -a python -m pytest -q
      - name: Check desktop figure controls
        run: xvfb-run -a python tests/figure_addons_smoke.py
      - name: Build and check standalone app and packages
        run: xvfb-run -a python scripts/build_linux.py
      - name: Check installed package and application menu entry
        run: |
          sudo apt-get install -y ./dist/release/*.deb
          desktop-file-validate /usr/share/applications/org.alder.Desktop.desktop
          test -x /usr/bin/alder
          xvfb-run -a env -u PYTHONPATH -u PYTHONHOME -u QT_PLUGIN_PATH PATH=/usr/bin:/bin ALDER_MLIP_HOME="$RUNNER_TEMP/alder-models" /usr/bin/alder --smoke-test "$GITHUB_WORKSPACE/build/linux-installed-smoke.json" "$GITHUB_WORKSPACE/tests/data"
          python -c 'import json; r=json.load(open("build/linux-installed-smoke.json")); assert r["ok"] and r["frozen"]'
          sudo apt-get remove -y alder
          test ! -e /usr/share/applications/org.alder.Desktop.desktop
      - name: Upload Linux downloads
        uses: actions/upload-artifact@v7
        with:
          name: Alder-Linux-${{ matrix.label }}
          path: dist/release/*
          compression-level: 0
          if-no-files-found: error
          retention-days: 30
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Linux-${{ matrix.label }}-diagnostics
          path: |
            build/*-smoke.json
            build/Alder/warn-*.txt
            ~/.local/state/Alder/*.log
          if-no-files-found: ignore
