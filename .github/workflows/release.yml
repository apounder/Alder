name: Desktop release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    uses: ./.github/workflows/windows.yml
    with:
      offline_mlip: false
  macos:
    uses: ./.github/workflows/macos.yml
  linux:
    uses: ./.github/workflows/linux.yml
  release:
    needs: [windows, macos, linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          pattern: Alder-*
          path: build/downloads
      - name: Verify and collect all platform downloads
        run: python3 scripts/prepare_release.py build/downloads build/release
      - name: Create a draft release with the tested installers
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          tag="v$version"
          if [ "$EVENT_NAME" = push ] && [ "$REF_NAME" != "$tag" ]; then
            echo "Tag must match pyproject.toml version: $tag" >&2
            exit 1
          fi
          if tag_commit=$(git rev-parse -q --verify "refs/tags/$tag^{commit}"); then
            if [ "$tag_commit" != "$GITHUB_SHA" ]; then
              echo "Tag $tag belongs to a different commit. Use a new version." >&2
              exit 1
            fi
          fi
          if gh release view "$tag" --json isDraft >/dev/null 2>&1; then
            echo "Release $tag already exists. Use a new version; existing release assets are never overwritten." >&2
            exit 1
          fi
          gh release create "$tag" build/release/* --target "$GITHUB_SHA" --draft --title "Alder $version" --notes-file packaging/RELEASE-NOTES.md
